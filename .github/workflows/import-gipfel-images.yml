name: One-time image assets import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Read images from original Gipfel-Lodge repository
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/wanderwerkhoven-afk/Gipfel-Lodge.git "$RUNNER_TEMP/gipfel-source"
          cd "$RUNNER_TEMP/gipfel-source"
          git sparse-checkout set assets beheer/assets beheer/site_manifest site_manifest siteground_upload
      - name: Copy missing images and SVG files without overwriting existing assets
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/gipfel-source"
          count=0
          while IFS= read -r -d '' file; do
            relative="${file#"$src"/}"
            if [[ ! -e "$relative" ]]; then
              mkdir -p "$(dirname "$relative")"
              cp -- "$file" "$relative"
              count=$((count+1))
            fi
          done < <(find "$src/assets" "$src/beheer/assets" "$src/beheer/site_manifest" "$src/site_manifest" "$src/siteground_upload" -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.svg' -o -iname '*.avif' -o -iname '*.bmp' -o -iname '*.ico' -o -iname '*.tif' -o -iname '*.tiff' \) -print0)
          echo "Imported new image files: $count"
          git add -- assets beheer/assets beheer/site_manifest site_manifest siteground_upload
          if git diff --cached --quiet; then
            echo "No missing image files"
            exit 0
          fi
          git -c user.name='Gipfel asset importer' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "assets: import all missing original Gipfel-Lodge images"
          git push origin HEAD:main
